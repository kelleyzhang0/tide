<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tide — what you value, what passes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="sky"></canvas>
  <header>
    <h1>Tide</h1>
    <p id="note"></p>
  </header>

  <aside id="drift">
    <h2>Then → now <span>(90 days)</span></h2>
    <ul id="driftList"></ul>
  </aside>

  <aside id="story" hidden>
    <button id="storyClose" type="button" aria-label="Close">×</button>
    <h2 id="storyTitle"></h2>
    <div id="storyText"></div>
  </aside>

  <footer>
    <div id="scrub">
      <label for="time" id="when"></label>
      <input id="time" type="range" min="0" max="1000" value="1000" />
    </div>
    <form id="form">
      <input id="text" placeholder="What's on your mind?" autocomplete="off" required />
      <button>Add to the shore</button>
    </form>
    <div id="tools">
      <button id="demo" type="button">Load demo</button>
      <button id="view" type="button">Switch view</button>
      <button id="export" type="button">Export</button>
      <button id="import" type="button">Import</button>
      <input id="importFile" type="file" accept="application/json" hidden />
      <button id="key" type="button">Claude key</button>
      <button id="clear" type="button">Clear</button>
      <span id="mode"></span>
    </div>
  </footer>
  <script type="module" src="app.js"></script>
</body>
</html>
